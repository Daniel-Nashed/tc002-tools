# A minimal nginx.conf for testing this project's nginx on the TC002.
# run_test.sh (next to this file) copies it, the page and a freshly made
# certificate to /tmp/ngx on the device and starts nginx there - see README.md.
#
# Written for THIS build (see ../README.md): no PCRE and no rewrite module, so
# there is no "return", "if", "set" or "rewrite", and "map" works without
# regular-expression patterns. Everything lives under /tmp/ngx, which is RAM on
# the device (it has only ~36 MB) - the test removes it again afterwards.

# There is no "nobody" account on the device; nginx started as root would fail
# on its default worker user without this.
user root;

worker_processes 1;

pid        /tmp/ngx/nginx.pid;
error_log  /tmp/ngx/error.log warn;

events {
    worker_connections 64;
}

http {
    access_log      off;
    server_tokens   off;
    default_type    text/plain;
    sendfile        on;
    keepalive_timeout 15;

    # Exercises the map module (no regex): the value is sent back in a header,
    # so run_test.sh can check it from the outside.
    map $uri $tc002_tag {
        default   "other";
        /status   "status";
    }

    # Plain HTTP. The device's own web UI (zkgui) already uses port 80.
    server {
        listen 8080;

        root /tmp/ngx/www;
        add_header X-TC002-Map $tc002_tag;

        location = /status {
            stub_status;
        }
    }

    # HTTPS with the certificate that make_cert.sh created. TLS 1.2 and 1.3 only:
    # the OpenSSL this nginx links has TLS 1.0/1.1 compiled out.
    server {
        listen 8443 ssl;

        ssl_certificate     /tmp/ngx/c.pem;
        ssl_certificate_key /tmp/ngx/k.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /tmp/ngx/www;
        add_header X-TC002-Map $tc002_tag;
    }
}
