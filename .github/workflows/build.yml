# Builds the core deliverables - dropbearmulti, nshbox, kilo, gzip, ncdu (with
# its terminfo) and the CA bundle - in the prebuilt ARM image, then runs
# verify.sh on them. The on-demand tools (curl, nginx, 7-Zip, the OpenSSL CLI)
# are not part of this workflow yet.
#
# The image comes from image.yml (built once per set of inputs, then only
# pulled), so this workflow takes minutes, not an hour.
# Started manually from the Actions tab (Run workflow), and called by release.yml,
# which attaches the result to a release. Not bound to pushes or tags.
name: Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  build:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the manifests record the git commit

      - name: Runner information
        shell: bash
        run: |
          {
            echo "### Runner"
            echo '```'
            echo "cpus:    $(nproc)  ($(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | sed -n '1p'))"
            echo "arch:    $(uname -m)   kernel: $(uname -r)"
            echo "memory:  $(free -h | sed -n 's/^Mem:[[:space:]]*\([^ ]*\).*/\1/p') total"
            echo "os:      $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release | tr -d '"')"
            echo "image:   ${ImageOS:-?} ${ImageVersion:-?}"
            echo "docker:  $(docker --version)"
            echo "disk:"
            df -h / /var/lib/docker 2>/dev/null
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same script contributors use: pulls the published image and tags it, so
      # the build below finds it and does not build it
      - name: Pull the build image
        run: ./pull_build_image.sh

      - name: Build the core deliverables
        run: ./build_all.sh

      - name: Verify the artifacts
        run: ./verify.sh

      - name: Upload dist/
        uses: actions/upload-artifact@v7
        with:
          name: tc002-tools-dist
          path: |
            dist/
            !dist/*.unstripped
          if-no-files-found: error
