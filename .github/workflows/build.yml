# Builds the core deliverables - dropbearmulti, nshbox, kilo, gzip, ncdu (with
# its terminfo) and the CA bundle - in the prebuilt ARM image, then runs
# verify.sh on them. The on-demand tools (curl, nginx, 7-Zip, the OpenSSL CLI)
# are not part of this workflow yet.
#
# The image comes from image.yml (built once per set of inputs, then only
# pulled), so this workflow takes minutes, not an hour.
# Started manually from the Actions tab for now (Run workflow); it is not bound
# to pushes, tags or releases.
name: Build

on:
  workflow_dispatch:

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  build:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the manifests record the git commit

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the build image
        run: |
          docker pull "${{ needs.image.outputs.ref }}"
          docker tag "${{ needs.image.outputs.ref }}" tc002-tools-build-musl:latest

      - name: Build the core deliverables
        env:
          TC002_SKIP_IMAGE_BUILD: '1'
        run: ./build_all.sh

      - name: Verify the artifacts
        env:
          TC002_SKIP_IMAGE_BUILD: '1'
        run: ./verify.sh

      - name: Upload dist/
        uses: actions/upload-artifact@v7
        with:
          name: tc002-tools-dist
          path: |
            dist/
            !dist/*.unstripped
          if-no-files-found: error
